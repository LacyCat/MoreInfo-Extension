<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>MoreInfo</title>
  <style>
    body { width: 260px; margin: 0; padding: 14px; box-sizing: border-box; font: 13px/1.5 sans-serif; color: #2d3748; }
    h1 { margin: 0 0 4px; font-size: 15px; }
    p { margin: 0 0 10px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e0; border-radius: 6px; font: inherit; }
    input:focus { outline: 2px solid #5381a0; outline-offset: -1px; }
    #status { min-height: 18px; margin-top: 6px; font-size: 12px; color: #718096; }
    #status.error { color: #e03131; }
    #status.ok { color: #2f9e44; }
  </style>
</head>
<body>
  <h1>작동하지 않나요?</h1>
  <p>솔브닥 아이디를 입력하여 보정하세요</p>
  <input id="handle" type="text" maxlength="30" placeholder="솔브닥 아이디" autocomplete="off" spellcheck="false" />
  <div id="status">Enter로 저장 · 비우면 원래대로</div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
